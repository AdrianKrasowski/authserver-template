services:
    sqlServer:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container-name: auth-sqlserver
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SQ_PASSWORD: "MyStrong!Passw0rd1"
        ports:
            - "14333:1433"
        volumes:
            - auth_sql_data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MyStrong!Passw0rd1' -Q 'SELECT 1' -C || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
            
    authserver:
        build:
            context: .
            dockerfile: AuthServer.Api/Dockerfile
        container-name: authserver-api
        depends_on:
            sqlServer:
                condition: service-healthy
        environment:
            ASPNETCORE_URLS: "https://+:8080"
            ASPNETCORE_ENVIRONMENY: "Development"
            ConnectionStrings_AuthServerDb: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=MyStrong!Passw0rd1;TrustServerCertificate=True;Encrypt=True;"
        ports:
            - "8088:8080"
        restart: unless-stopped
        
volumes:
    auth_sql_data